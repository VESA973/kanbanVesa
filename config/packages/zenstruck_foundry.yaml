when@dev:
    zenstruck_foundry:
        faker:
            locale: fr_FR
        persistence:
            # Flush only once per call of `PersistentObjectFactory::create()`
            flush_once: true

when@test:
    zenstruck_foundry:
        faker:
            locale: fr_FR
        persistence:
            flush_once: true
        orm:
            reset:
                # Tests build their database with the migrations, which keeps them verified.
                mode: migrate
