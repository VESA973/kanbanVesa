# Included in the kanban.lan VirtualHost: the browser reaches the hub on the
# same origin as the application, so the authorization cookie is sent.
# Requires mod_proxy_http.
<Location "/.well-known/mercure">
    ProxyPass "http://127.0.0.1:3000/.well-known/mercure" flushpackets=on timeout=3600
    ProxyPassReverse "http://127.0.0.1:3000/.well-known/mercure"
</Location>
